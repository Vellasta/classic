syntax = "proto3";
package proto;

option go_package = "./proto";

message HunterTalents {
	// Beast Mastery
	int32 swift_aspects = 1;
	int32 endurance_training = 2;
	int32 improved_eyes_of_the_beast = 3;
	int32 improved_primal_aspects = 4;
	int32 thick_hide = 5;
	int32 improved_revive_pet = 6;
	int32 pathfinding = 7;
	bool coordinated_assault = 8;
	int32 unleashed_fury = 9;
	int32 bestial_discipline = 10;
	int32 improved_mend_pet = 11;
	int32 ferocity = 12;
	int32 scent_of_blood = 13;
	bool bestial_wrath = 14;
	bool intimidation = 15;
	int32 bestial_precision = 16;
	int32 spirit_bond = 17;
	int32 frenzy = 18;
	bool kill_command = 19;

	// Marksmanship
	int32 improved_concussive_shot = 20;
	int32 efficiency = 21;
	int32 improved_stings = 22;
	int32 lethal_shots = 23;
	int32 hawk_eye = 24;
	bool aimed_shot = 25;
	int32 swiftshot = 26;
	int32 endless_quiver = 27;
	int32 mortal_shots = 28;
	bool scatter_shot = 29;
	bool experimental_ammunition = 30;
	int32 piercing_shots = 31;
	int32 barrage = 32;
	int32 improved_marksmanship = 33;
	int32 ranged_weapon_specialization = 34;
	bool lock_and_load = 35;

	// Survival
	int32 improved_slaying = 36;
	int32 resourcefulness = 37;
	int32 swift_reflexes = 38;
	int32 entrapment = 39;
	int32 savage_strikes = 40;
	int32 improved_wing_clip = 41;
	int32 alone_against_the_world = 42;
	int32 planning_ahead = 43;
	int32 survivalist = 44;
	bool carve = 45;
	bool deterrence = 46;
	int32 stinging_nettle = 47;
	int32 surefooted = 48;
	int32 improved_feign_death = 49;
	int32 killer_instinct = 50;
	int32 trap_mastery = 51;
	bool lacerate = 52;
	int32 vicious_strikes = 53;
	int32 lightning_reflexes = 54;
	bool untamed_trapper = 55;
}

message Hunter {
	message Rotation {
		enum RotationType {
			UnknownType = 0;
			SingleTarget = 1;
			Aoe = 3;
			Custom = 2;
		}
		RotationType type = 9;

		enum StingType {
			NoSting = 0;
			ScorpidSting = 1;
			SerpentSting = 2;
		}
		StingType sting = 2;
		bool multi_dot_serpent_sting = 3;
	}
	
	message Options {
		enum Ammo {
			AmmoNone = 0;
			// 25
			RazorArrow = 1;
			SolidShot = 2;
			// 40
			JaggedArrow = 3;
			AccurateSlugs = 4;
			// 50
			MithrilGyroShot = 5;
			RockshardPellets = 6;
			// 60
			IceThreadedArrow = 7;
			ThoriumHeadedArrow = 8;
			Doomshot = 9;
			IceThreadedBullet = 10;
			ThoriumShells = 11;
			MiniatureCannonBalls = 12;
		}
		Ammo ammo = 1;

		enum QuiverBonus
		{
			QuiverNone = 0;
			Speed10 = 1;
			Speed11 = 2;
			Speed12 = 3;
			Speed13 = 4;
			Speed14 = 5;
			Speed15 = 6;
		}
		QuiverBonus quiver_bonus = 2;

		enum PetType {
			PetNone = 0;
			Cat = 1;
			WindSerpent = 2;
			Wolf = 3;
			Bat = 4;
			Bear = 5;
			Owl = 6;
			Boar = 7;
			CarrionBird = 8;
			Crab = 9;
			Crocolisk = 10;
			Gorilla = 11;
			Hyena = 12;
			Raptor = 13;
			Scorpid = 14;
			Spider = 15;
			Tallstrider = 16;
			Turtle = 17;
		}

		enum PetAttackSpeed {
			One = 0;
			OneTwo = 1;
			OneThree = 2;
			OneFour = 3;
			OneFive = 4;
			OneSix = 5;
			OneSeven = 6;
			Two = 7;
			TwoFour = 8;
			TwoFive = 9;
		}

		PetType pet_type = 3;
		double pet_uptime = 4;

		double pet_attack_speed_old = 5;

		bool new_raptor_strike = 6;

		PetAttackSpeed pet_attack_speed = 7;
	}
	Options options = 2;
}
